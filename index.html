<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
    <title></title>
</head>

<body>
    <div class="tabs">
        <button class="tab-button active" onclick="showTab('tab1')">Tab 1</button>
        <button class="tab-button" onclick="showTab('tab2')">Tab 2</button>
    </div>

    <div id="tab1" class="tab-content active">
        <div class="row">
            <div class="col text-center">
                <button class="btn btn-danger mb-4" type="button" onclick="clearAll()"><i
                        class="bi bi-x-circle"></i></button>
            </div>
        </div>

        <div class="input-group mb-5">
            <input id="originalText" type="text" class="form-control" placeholder="" aria-label=""
                aria-describedby="basic-addon2" onfocus="this.select();">
            <div class="input-group-append">
                <button class="btn btn-light" type="button" onclick="convertText()"><i class="bi bi-type"></i></button>
            </div>
        </div>

        <div class="input-group">
            <input id="moddedText" type="text" class="form-control" placeholder="" aria-label=""
                aria-describedby="basic-addon2" onfocus="this.select();">
            <div class="input-group-append">
                <button class="btn btn-light" type="button" onclick="copyToClipboard()"><i
                        class="bi bi-clipboard"></i></button>
            </div>
        </div>
    </div>

    <div id="tab2" class="tab-content">
        <div class="text-center mb-4">
            <select id="dropdownMenu" onchange="updateDropdownContent(); updateDropdownContentInLinks();"></select>
        </div>

        <div class="text-center mb-4">
            <label for="productName">Termék neve:</label><br>
            <input type="text" id="productName" class="form-control mb-3" />

            <label for="productDescription">Leírás a termékről:</label><br>
            <textarea id="productDescription" class="form-control" rows="10"></textarea>
        </div>

        <div id="editorMainXml"></div>
        <div id="editorInLinks"></div>

        <div class="row my-3">
            <div class="col text-center">
                <button class="btn btn-success mx-2" type="button" onclick="generatePrompt()">
                    <i class="bi bi-arrow-right-circle"></i> Go
                </button>
                <button class="btn btn-primary mx-2" type="button" onclick="copyPrompt()">
                    <i class="bi bi-arrow-right-circle"></i> Másolás
                </button>
                <button class="btn btn-dark mx-2" type="button" onclick="scrollToTop()">
                    <i class="bi bi-arrow-up-circle"></i> Oldal tetejére
                </button>
            </div>
        </div>

        <div id="editorPrompt"></div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.3/ace.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script src="filemap.js"></script>
</body>

</html>
